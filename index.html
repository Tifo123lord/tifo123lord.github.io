<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Queen Token - tap to earn Telegram Mini App.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1A12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Queen Token">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Queen Token</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { background: #050B08; margin: 0; overscroll-behavior: none; }</style>
  <!-- Telegram Mini App SDK: window.Telegram.WebApp (user, start_param, haptics). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
  try{if(location.hash&&location.hash.indexOf('tgWebApp')>=0){history.replaceState(null,'',location.pathname+location.search);}}catch(e){}</script>
  <!-- TADS rewarded fullscreen ads SDK: window.tads (widget 13197). -->
  <script src="https://w.tads.me/widget.js" async></script>
  <script>
    window.QT_TADS_WIDGET_ID = 13197;
    window.qtShowAd = function () {
      return new Promise(function (resolve) {
        var tries = 0, settled = false;
        function fin(v) { if (!settled) { settled = true; resolve(v); } }
        (function go() {
          if (!window.tads || !window.tads.init) {
            if (tries++ < 40) { return setTimeout(go, 200); }
            return fin('error: TADS SDK not loaded');
          }
          try {
            window.__qtResolve = fin;
            if (!window.__qtAd) {
              window.__qtAd = window.tads.init({
                widgetId: window.QT_TADS_WIDGET_ID,
                type: 'fullscreen',
                debug: false,
                onShowReward: function () { if (window.__qtResolve) window.__qtResolve('done'); },
                onAdsNotFound: function () { if (window.__qtResolve) window.__qtResolve('no_ads: No ads available right now'); }
              });
            }
            var p = window.__qtAd.showAd();
            if (p && p.catch) {
              p.catch(function (e) { fin('error: ' + (e && (e.message || e.description) || String(e))); });
            }
            setTimeout(function () { fin('notdone: Ad was not watched to the end'); }, 120000);
          } catch (e) { fin('error: ' + (e && e.message || String(e))); }
        })();
      });
    };
  </script>
  <script>
    // Shim: the Flutter build calls window.Adsgram.init({blockId}).show(); route it to TADS.
    window.Adsgram = {
      init: function () {
        return {
          show: function () {
            return window.qtShowAd().then(function (r) {
              if (r === 'done') return { done: true, state: 'load', description: 'Ad watched' };
              var i = String(r).indexOf(':');
              var st = i > 0 ? String(r).slice(0, i) : String(r);
              var d = i > 0 ? String(r).slice(i + 1).trim() : String(r);
              return { done: false, state: st, description: d };
            });
          }
        };
      }
    };
  </script>
</head>
<body>
  <div id="qt-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E8C66A;font-family:sans-serif;font-size:16px;text-align:center;padding:24px">
    <div style="font-size:22px;font-weight:bold;margin-bottom:12px">Queen Token</div>
    <div id="qt-msg">Loading...</div>
  </div>
  <script>
    window.addEventListener('error',function(e){var m=document.getElementById('qt-msg');if(m)m.textContent='Error: '+(e.message||(e.target&&e.target.src)||'load failed');},true);
    window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('qt-msg');if(m)m.textContent='Error: '+(e.reason&&e.reason.message||e.reason);});
    setTimeout(function(){var m=document.getElementById('qt-msg');if(m&&m.textContent==='Loading...')m.textContent='Still loading... (slow network?)';},15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
